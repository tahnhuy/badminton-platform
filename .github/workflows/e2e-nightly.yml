name: E2E Nightly

on:
  schedule:
    # 19:00 UTC = 02:00 sáng giờ Việt Nam (UTC+7).
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  CI: 'true'

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: badminton_user
          POSTGRES_PASSWORD: badminton_password
          POSTGRES_DB: badminton_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U badminton_user -d badminton_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Pepper CHỈ dùng cho test/CI. Không phải secret production.
      PASSWORD_PEPPER: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Ensure test database exists
        working-directory: backend
        run: |
          node -e '
          const { Client } = require("pg");
          (async () => {
            const client = new Client({
              connectionString: "postgres://badminton_user:badminton_password@localhost:5433/badminton_db",
            });
            await client.connect();
            const result = await client.query(
              "SELECT 1 FROM pg_database WHERE datname = $1",
              ["badminton_test"],
            );
            if (result.rowCount === 0) {
              await client.query("CREATE DATABASE badminton_test");
              console.log("Created badminton_test");
            } else {
              console.log("badminton_test already exists");
            }
            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          '

      - name: Install Chrome for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e -- --reporter=list,html --trace=retain-on-failure --output=../docs/reports/testing/artifacts/e2e-results
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../docs/reports/testing/artifacts/playwright-report

      - name: Run live tournament separately
        working-directory: frontend
        run: npm run test:e2e:tournament -- --reporter=list,html --trace=retain-on-failure --output=../docs/reports/testing/artifacts/tournament-results
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../docs/reports/testing/artifacts/playwright-report-tournament

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: docs/reports/testing/artifacts
          retention-days: 90
          if-no-files-found: ignore
