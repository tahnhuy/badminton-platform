version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: badminton_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-badminton_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-badminton_password}
      POSTGRES_DB: ${DB_NAME:-badminton_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
