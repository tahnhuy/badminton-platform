<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none">
  <defs>
    <linearGradient id="floor" x1="80" y1="0" x2="810" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#7cba76"/><stop offset=".4" stop-color="#4a9a60"/><stop offset="1" stop-color="#24794e"/></linearGradient>
    <linearGradient id="edge" x1="42" y1="250" x2="600" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#274e39"/><stop offset=".5" stop-color="#204a34"/><stop offset="1" stop-color="#163d2b"/></linearGradient>
    <linearGradient id="bevel" x1="40" y1="240" x2="650" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#a3d090"/><stop offset=".35" stop-color="#7dbd78"/><stop offset="1" stop-color="#3f8654"/></linearGradient>
    <linearGradient id="racket" x1="-45" y1="-65" x2="45" y2="65" gradientUnits="userSpaceOnUse"><stop stop-color="#eff6cb"/><stop offset=".25" stop-color="#dcf1a6"/><stop offset=".65" stop-color="#8eaa57"/><stop offset="1" stop-color="#def0a7"/></linearGradient>
    <linearGradient id="feather" x1="-30" y1="-55" x2="25" y2="45" gradientUnits="userSpaceOnUse"><stop stop-color="#fffef1"/><stop offset=".65" stop-color="#e3e9cf"/><stop offset="1" stop-color="#a4b8a0"/></linearGradient>
    <linearGradient id="arc" x1="100" y1="170" x2="600" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#d8ed9b" stop-opacity="0"/><stop offset=".35" stop-color="#d8ed9b" stop-opacity=".6"/><stop offset="1" stop-color="#ecf7c0"/></linearGradient>
    <pattern id="strings" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0H12M0 0V12" stroke="#d2e5a8" stroke-opacity=".56" stroke-width=".8"/></pattern>
    <pattern id="net" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="matrix(1 .64 0 1 0 0)"><path d="M0 0H11M0 0V11" stroke="#e3efd2" stroke-opacity=".3" stroke-width=".8"/></pattern>
    <clipPath id="head"><ellipse rx="43" ry="59"/></clipPath>
    <filter id="shadow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Ground shadow and layered slab give the vector court real depth. -->
  <ellipse cx="357" cy="362" rx="257" ry="46" fill="#021f15" opacity=".46" filter="url(#shadow)"/>
  <path d="M42 230 447 63 657 197V220L252 387 42 253Z" fill="url(#edge)"/>
  <path d="M42 230 447 63 657 197V204L252 371 42 237Z" fill="url(#bevel)"/>
  <g transform="matrix(.46 -.19 .5 .32 42 230)">
    <rect width="880" height="420" rx="8" fill="url(#floor)"/>
    <rect x="28" y="24" width="824" height="372" rx="2" fill="#3d8e54" stroke="#e1efc5" stroke-width="4"/>
    <path d="M68 24V396M812 24V396M28 49H852M28 371H852M315 24V396M565 24V396M28 210H315M565 210H852" stroke="#e1efc5" stroke-opacity=".85" stroke-width="3"/>
    <path d="M440 0V420" stroke="#e1efc5" stroke-opacity=".38" stroke-width="2"/>
    <ellipse cx="220" cy="135" rx="35" ry="29" fill="#16462c" opacity=".2"/>
    <ellipse cx="670" cy="285" rx="35" ry="29" fill="#16462c" opacity=".2"/>
    <circle cx="220" cy="135" r="21" fill="#cfe693" stroke="#f0f8d5" stroke-width="4"/>
    <circle cx="670" cy="285" r="21" fill="#eff3da" stroke="#fffef1" stroke-width="4"/>
    <circle cx="220" cy="135" r="38" stroke="#e1efc5" stroke-opacity=".26" stroke-width="2"/>
    <circle cx="670" cy="285" r="38" stroke="#e1efc5" stroke-opacity=".26" stroke-width="2"/>
  </g>

  <!-- A suspended net follows the same court projection. -->
  <path d="M234 84 464 231V290L234 143Z" fill="#153d2c" fill-opacity=".18"/>
  <path d="M234 84 464 231V290L234 143Z" fill="url(#net)"/>
  <path d="M234 84 464 231" stroke="#eff5d4" stroke-width="3.5"/>
  <path d="M234 143 464 290" stroke="#d7e9b8" stroke-opacity=".55" stroke-width="1.5"/>
  <path d="M234 77V148M464 224V295" stroke="#adc98b" stroke-width="5" stroke-linecap="round"/>
  <path d="M233 77V148M463 224V295" stroke="#e0edb6" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="465" cy="298" rx="10" ry="4" fill="#153c28" opacity=".5"/>

  <!-- A single readable flight path, rather than decorative particles. -->
  <path d="M128 227C173 43 367 10 543 110" stroke="url(#arc)" stroke-width="1.5" stroke-dasharray="5 7"/>
  <path d="m535 101 10 10-14-1" stroke="#e5f3bb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badminton racket, with string mesh and wrapped grip. -->
  <g transform="translate(570 96) rotate(28)">
    <ellipse cx="8" cy="12" rx="45" ry="62" fill="#05291c" opacity=".25" filter="url(#soft)"/>
    <ellipse rx="46" ry="63" fill="#123c2b" stroke="#4d7445" stroke-width="6"/>
    <ellipse rx="45" ry="62" fill="url(#strings)" stroke="url(#racket)" stroke-width="4"/>
    <ellipse rx="40" ry="57" stroke="#e0ecb4" stroke-opacity=".75" stroke-width="1"/>
    <path d="M-14 59 0 88 14 59" stroke="#d5e8a9" stroke-width="2.5"/>
    <path d="M0 86V137" stroke="#8ea67a" stroke-width="5"/>
    <path d="M-1 86V137" stroke="#e4edc9" stroke-width="1.5"/>
    <rect x="-6" y="134" width="12" height="53" rx="5" fill="#d5e79e"/>
    <path d="m-5 141 10 5m-10 3 10 5m-10 3 10 5m-10 3 10 5m-10 3 10 5" stroke="#8f9f63" stroke-width="1"/>
    <path d="M-5 185H5" stroke="#ecf3c5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Feather shuttlecock: all paths, no photographic or bitmap asset. -->
  <g transform="translate(143 117) rotate(-33)">
    <ellipse cx="8" cy="55" rx="32" ry="12" fill="#072f1f" opacity=".3" filter="url(#soft)"/>
    <path d="M-11 30-45-41Q-42-52-34-48L-4 28Z" fill="url(#feather)" stroke="#e8efdc" stroke-width=".8"/>
    <path d="M-8 29-30-54Q-23-63-17-54L-2 29Z" fill="url(#feather)" stroke="#e8efdc" stroke-width=".8"/>
    <path d="M-4 28-11-61Q-3-69 3-58L3 29Z" fill="url(#feather)" stroke="#e8efdc" stroke-width=".8"/>
    <path d="M1 29 8-59Q17-65 21-53L7 30Z" fill="url(#feather)" stroke="#e8efdc" stroke-width=".8"/>
    <path d="M6 30 27-52Q36-57 38-45L11 32Z" fill="url(#feather)" stroke="#e8efdc" stroke-width=".8"/>
    <path d="M10 33 43-38Q51-42 52-31L15 36Z" fill="url(#feather)" stroke="#e8efdc" stroke-width=".8"/>
    <path d="m-39-41 32 71m-16-82 18 81M-4-58 3 30m12-84L7 31m24-76L11 33m36-64L14 36" stroke="#94a78d" stroke-width=".9"/>
    <path d="M-16 17Q0 25 21 21M-12 24Q4 32 17 28" stroke="#e8eaca" stroke-width="3"/>
    <path d="M-10 29Q3 35 16 32L14 45Q4 57-6 45Z" fill="#f1eccd" stroke="#c7ccac" stroke-width="1"/>
    <path d="M-8 32Q3 37 15 35" stroke="#678154" stroke-width="3"/>
  </g>

  <g fill="#d9e9b0" opacity=".65"><circle cx="62" cy="146" r="2"/><circle cx="641" cy="330" r="2"/><circle cx="416" cy="27" r="2"/></g>
  <path d="M85 335H106M95.5 324.5V345.5M614 44H628M621 37V51" stroke="#cde39c" stroke-opacity=".45" stroke-width="1.2"/>
</svg>
